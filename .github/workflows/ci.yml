name: CI
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared unit tests
        run: ./gradlew :shared:jvmTest
      - name: Android lint
        run: ./gradlew :androidApp:lintDebug
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests
            androidApp/build/reports

  build-apk:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to publish the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tennisbuddy-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish debug APK as GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp androidApp/build/outputs/apk/debug/*.apk tennisbuddy-debug.apk
          gh release delete latest-debug --cleanup-tag --yes || true
          gh release create latest-debug tennisbuddy-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest debug build" \
            --notes "Debug APK built from commit $GITHUB_SHA. Replaced on every push to main."
